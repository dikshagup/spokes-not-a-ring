[project]
name = "weekday-manifold"
version = "2.0.0"
description = "Code for \"Spokes, not a Ring\": every figure and quoted number of the manuscript"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Diksha Gupta" },
    { name = "Rieke Fruengel" },
    { name = "Stefan Heimersheim" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.1",
    "torch>=2.8.0",
    "transformer-lens~=2.0",
    "huggingface-hub>=0.36.2",
    "matplotlib>=3.9.4",
    "fonttools>=4.40",
    "pandas>=2.0",
    "datasets>=2.19",
    "pyarrow<26",
]

[project.urls]
Repository = "https://github.com/dikshagup/spokes-not-a-ring"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weekday_manifold"]

[tool.pytest.ini_options]
pythonpath = ["src", "experiments/common", "tests"]
testpaths = ["tests"]
